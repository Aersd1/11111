name: Desktop packages
on:
  workflow_dispatch:
    inputs:
      package:
        description: Build desktop archives after tests
        type: boolean
        default: true
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: Windows-x86_64
          - runner: macos-15
            label: macOS-arm64
          - runner: macos-15-intel
            label: macOS-x86_64
          - runner: ubuntu-22.04
            label: Linux-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libxcb-xinput0 libxcb-damage0 libxcb-shape0 libxcb-randr0 libxcb-render0 libxcb-sync1 libxcb-xfixes0 fonts-noto-cjk
      - run: python -m pip install -r requirements-build.txt
      - name: Verify native Linux plugin dependencies
        if: runner.os == 'Linux'
        run: python packaging/check_graphics.py
      - name: Cross-platform checks
        run: python -m unittest discover -s tests -p test_packaging.py -v
      - name: Inline folder interactions
        run: python -m unittest discover -s tests -p test_inline_folders.py -v
      - name: Model response handling
        run: python -m unittest discover -s tests -p test_model_response.py -v
      - name: Analysis and settings regression checks
        run: |
          python -m unittest discover -s tests -p test_api_settings.py -v
          python -m unittest discover -s tests -p test_library.py -v
          python -m unittest discover -s tests -p test_research_features.py -v
          python -m unittest discover -s tests -p test_ui.py -v
      - name: Full-text analysis and Markdown
        run: python -m unittest discover -s tests -p test_fulltext_agent.py -v
      - name: Live formula editor
        shell: bash
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'macOS' && 'cocoa' || runner.os == 'Linux' && 'xcb' || 'offscreen' }}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a python -m unittest discover -s tests -p test_live_markdown.py -v
          else
            python -m unittest discover -s tests -p test_live_markdown.py -v
          fi
      - name: Build and test packaged application
        if: github.event_name == 'push' || inputs.package
        shell: bash
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'macOS' && 'cocoa' || runner.os == 'Linux' && 'xcb' || 'offscreen' }}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a python packaging/build_release.py
          else
            python packaging/build_release.py
          fi
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || inputs.package
        with:
          name: LiteratureShelf-${{ matrix.label }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Publish desktop downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release-files/* --title "文献书架 $GITHUB_REF_NAME" --notes "更新文献分析：普通整理综合引言、结论和局限，改进 PDF 提取复用及批量整理，设置增加受支持模型的思考开关；支持流式模型响应，改进超时、异常响应与输出截断提示；全文阅读支持受调用预算限制的重试，保留已完成的阅读笔记及原有总结。保留 Markdown / LaTeX 实时预览和链接编辑。Windows 解压运行 EXE；Mac 打开 DMG；Linux 解压运行，无需配置 Python 环境。"
