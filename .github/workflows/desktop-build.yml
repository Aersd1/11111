name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: Windows-x86_64
          - runner: macos-15
            label: macOS-arm64
          - runner: macos-15-intel
            label: macOS-x86_64
          - runner: ubuntu-22.04
            label: Linux-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libxcb-xinput0 libxcb-damage0 libxcb-shape0 libxcb-randr0 libxcb-render0 libxcb-sync1 libxcb-xfixes0 fonts-noto-cjk
      - run: python -m pip install -r requirements-build.txt
      - name: Verify native Linux plugin dependencies
        if: runner.os == 'Linux'
        run: python packaging/check_graphics.py
      - name: Cross-platform checks
        run: python -m unittest discover -s tests -p test_packaging.py -v
      - name: Inline folder interactions
        run: python -m unittest discover -s tests -p test_inline_folders.py -v
      - name: Full-text analysis and Markdown
        run: python -m unittest discover -s tests -p test_fulltext_agent.py -v
      - name: Live formula editor
        shell: bash
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'macOS' && 'cocoa' || runner.os == 'Linux' && 'xcb' || 'offscreen' }}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a python -m unittest discover -s tests -p test_live_markdown.py -v
          else
            python -m unittest discover -s tests -p test_live_markdown.py -v
          fi
      - name: Build and test packaged application
        shell: bash
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'macOS' && 'cocoa' || runner.os == 'Linux' && 'xcb' || 'offscreen' }}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a python packaging/build_release.py
          else
            python packaging/build_release.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: LiteratureShelf-${{ matrix.label }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Publish desktop downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release-files/* --title "文献书架 $GITHUB_REF_NAME" --notes "新增左右实时编辑：左侧输入 Markdown / LaTeX，右侧在应用内显示完整公式和排版，分隔条可拖动。支持插入网页与本地附件链接，保留加粗、斜体和公式快捷按钮。总结及个人描述保存后同样显示公式。内置离线排版组件，无需另装环境，安装包体积相应增加。保留全文 Agent、论文十问、缓存和历史版本。Windows 解压运行 EXE；Mac 打开 DMG；Linux 解压运行。未签名版本可能需要系统首次确认。"
