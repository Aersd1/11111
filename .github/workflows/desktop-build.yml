name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: Windows-x86_64
          - runner: macos-15
            label: macOS-arm64
          - runner: macos-15-intel
            label: macOS-x86_64
          - runner: ubuntu-22.04
            label: Linux-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 fonts-noto-cjk
      - run: python -m pip install -r requirements-build.txt
      - name: Cross-platform checks
        run: python -m unittest discover -s tests -p test_packaging.py -v
      - name: Inline folder interactions
        run: python -m unittest discover -s tests -p test_inline_folders.py -v
      - name: Build and test packaged application
        run: python packaging/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: LiteratureShelf-${{ matrix.label }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Publish desktop downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release-files/* --title "文献书架 $GITHUB_REF_NAME" --notes "新增目录原位编辑：新建大类、小类及重命名均不再弹窗。直接输入名称，Enter 或点击其他位置保存，Esc 取消，支持中文输入与原位纠错。无需安装 Python。Windows 解压后运行 EXE；Mac 打开 DMG；Linux 解压后运行程序。AI 功能在设置中填写自己的 API。未签名版本可能需要系统首次确认。"
